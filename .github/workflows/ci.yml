name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # 闸门的唯一定义在 scripts/gate.sh（= pnpm verify + pnpm build）。
      # 以前这两步写在这里、AGENTS/CLAUDE.md 里另抄一份，改一处另两处不会跟着变。
      #
      # 注：这里**不再需要**按 Dependabot 分支走不同路径。此前 build 要预渲染
      # `src/lib/supabase.ts`，而它曾在模块作用域 createClient、缺 env 即抛
      # —— Dependabot 的 PR 拿不到 secrets，于是必然红。现在那个模块在缺 env 时
      # 返回「取用才抛」的替身，**构建不再依赖 env**，所以依赖更新 PR 也能跑完整闸门。
      # （secrets 仍然要传：`pnpm verify` 里的若干测试会在缺 env 时**静默跳过**，
      #  那样等于悄悄丢了覆盖 —— 那种「缺了就降级」正是本仓库列为陷阱的一类。）
      - name: 闸门
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bash scripts/gate.sh

  gen-types-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.actor != 'dependabot[bot]'
      && !(github.event_name == 'pull_request' && github.head_ref == 'chore/sync-types-from-backend')
      && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: sync database types'))

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # 比对目标是 **dev**，而且这个 project ref 是**故意写死在这里的**（2026-09-29 起）。
      #
      # 为什么是 dev：本仓库 `main` 上装的类型由 pkuso-backend 的 sync-dev.yml 独家写入、
      # 内容取自 **dev** schema。检查必须比对照同一个环境，否则就是假红 —— 实测
      # 2026-09-27 run 36312148142：提交的文件含 client_error_logs（dev 已有），
      # 而当时链接的 prod 没有，红得毫无信息量，随后被所有人忽略。
      #
      # 为什么写死、而不是再用一个 secret：**这次出问题的根因，恰恰是「比对的是哪个环境」
      # 藏在一个看不见的 secret 里**（`SUPABASE_PROJECT_REF` 名字中性，值指向 prod，
      # 从 diff 里永远看不出来）。project ref 不是凭据 —— 它在每个请求的 URL 里，
      # 也公开写在本仓 `.mcp.json` 与 pkuso-backend 的 CLAUDE.md 里。真正需要保密的
      # `SUPABASE_ACCESS_TOKEN` 仍然走 secret。把环境显式写出来，正是为了让评审能看到它。
      #
      # ⚠️ 改这里之前先读 pkuso-backend/CLAUDE.md 的「类型同步的目标分支」一节。
      - name: 验证 dev schema 与提交的类型文件一致
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref qibssimzuhusvutubbey
          supabase gen types typescript --linked > /tmp/remote.ts
          # 比对表列结构(忽略分号/缩进等 CLI 版本间格式差异)
          node .github/scripts/compare-db-types.mjs src/types/database.types.ts /tmp/remote.ts

  branch-name:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    # Dependabot 的分支叫 `dependabot/npm_and_yarn/...`，永远不满足下面的 `<type>/<简述>`
    # 正则。不排除它的话，**每一个依赖更新 PR 一开出来就是红的** —— 而这种「反正一直是红的」
    # 会被所有人忽略，等真正需要看这条检查时它已经没有信号了。
    #
    # ⚠️ 这里判的是 **PR 的作者**，不是 `github.actor`。两者的区别有实测依据
    #    （2026-09-29：#348 被人 reopen 之后本 job 重新变红）：
    #      · 需要 secret 的两个 job（下面 verify 的 build 段、gen-types-check）
    #        用 `github.actor` —— 那正好对应 GitHub 扣留 secrets 的条件
    #        （实测：人 reopen 后 secrets 就被发放了，那两个 job 随即变绿）。
    #      · 本 job 要判的是「这个 PR 是不是 Dependabot 开的」，与谁触发无关。
    #        用 actor 的话，人点一次 reopen / 重跑就会让它重新变红。
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login != 'dependabot[bot]'

    steps:
      - name: 校验分支命名规范
        run: |
          BRANCH="${{ github.head_ref }}"
          if ! echo "$BRANCH" | grep -qE '^(feat|fix|docs|refactor|test|chore|build|ci|style)/'; then
            echo "::error::分支命名不规范: $BRANCH"
            echo "期望格式: <type>/<简述> (type = feat|fix|docs|refactor|test|chore|build|ci|style)"
            exit 1
          fi
          echo "✅ 分支名符合规范: $BRANCH"
